[project]
name = "stock-analysis-tool"
version = "0.1.0"
description = "Financial analysis and sentiment dashboard for stocks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.66.1",
    "pandas>=3.1.0",
    "numpy>=2.4.0",
    "plotly>=7.1.0",
    "yfinance>=1.7.0",
    "vaderSentiment>=3.3.2",
    "python-dotenv>=1.2.0",
    "requests>=2.32.0",
    "defusedxml>=0.7.1",
    "Pillow>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []
