name: Secret scan

# Two scans. The current files decide the result: findings there fail the build
# when FAIL_ON_FINDINGS is 'true' (warnings only otherwise). Git history is
# scanned too, but findings that only exist in old commits are warnings, since a
# key that was removed still needs rotating but cannot be fixed by a new commit.
# Allowlist reviewed false positives in .gitleaks.toml.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
  FAIL_ON_FINDINGS: 'true'

jobs:
  gitleaks:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan with gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          # --redact keeps secret values out of the job log.
          T="${RUNNER_TEMP:-/tmp}"
          ./gitleaks dir . --redact --no-banner --exit-code 0             --report-format json --report-path "$T/current.json"
          ./gitleaks detect --source . --redact --no-banner --exit-code 0             --report-format json --report-path "$T/history.json"
          python3 - <<'PY'
          import collections, json, os, sys
          t = os.environ.get("RUNNER_TEMP", "/tmp")
          def load(name):
              p = os.path.join(t, name)
              return json.load(open(p)) if os.path.exists(p) and os.path.getsize(p) else []
          current, history = load("current.json"), load("history.json")
          now = {(f["RuleID"], f["File"].lstrip("./")) for f in current}
          old = [f for f in history if (f["RuleID"], f["File"].lstrip("./")) not in now]
          print(f"current files: {len(current)} finding(s); history only: {len(old)}")
          for (rule, path), n in collections.Counter(
              (f["RuleID"], f["File"]) for f in current
          ).most_common(25):
              print(f"::warning file={path}::{n} possible secret(s) matched rule {rule}")
          for (rule, path), n in collections.Counter(
              (f["RuleID"], f["File"]) for f in old
          ).most_common(25):
              print(f"::warning file={path}::{n} secret(s) in git history only (rotate if real), rule {rule}")
          if current and os.environ.get("FAIL_ON_FINDINGS") == "true":
              sys.exit(1)
          PY
